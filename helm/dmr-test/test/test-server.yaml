apiVersion: v1
kind: Pod
metadata:
  name: test-server
  labels:
    app: test-server
spec:
  containers:
    - name: node
      image: node:18-alpine
      command: ["node", "/app/test-server.js"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: script-volume
          mountPath: /app
  volumes:
    - name: script-volume
      configMap:
        name: test-server-script
---
apiVersion: v1
kind: Service
metadata:
  name: test-server
spec:
  selector:
    app: test-server
  ports:
    - port: 8080
      targetPort: 8080
