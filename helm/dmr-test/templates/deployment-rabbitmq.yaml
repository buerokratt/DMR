apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.user | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              value: {{ .Values.rabbitmq.pass | quote }}
          volumeMounts:
            - name: rabbitmq-lib
              mountPath: /var/lib/rabbitmq/
            - name: rabbitmq-log
              mountPath: /var/log/rabbitmq/
            - name: plugin-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf              
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: plugin-config
          configMap:
            name: rabbitmq-plugins
        - name: rabbitmq-lib
          emptyDir: {}
        - name: rabbitmq-log
          emptyDir: {}
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
