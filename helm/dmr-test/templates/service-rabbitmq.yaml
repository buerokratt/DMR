apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: {{ .Values.rabbitmq.ports.amqp }}
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: {{ .Values.rabbitmq.ports.ui }}
  type: NodePort
