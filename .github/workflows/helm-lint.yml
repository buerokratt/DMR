name: Helm Lint

on:
  push:
    paths:
      - 'helm/**'
  pull_request:
    paths:
      - 'helm/**'

jobs:
  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Run Helm Lint
        run: helm lint helm/dmr

      - name: Helm Dry Run Install
        run: helm template dmr helm/dmr --values helm/dmr/values.yaml --debug
