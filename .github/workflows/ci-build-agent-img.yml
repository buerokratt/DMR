name: Build and publish DMR agent

on:
  workflow_dispatch:
  push:
    branches:
      - aws
    paths:
      - 'env.agent'

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Validate agent
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Configure test environment
        run: cp apps/dmr-agent/.env.example apps/dmr-agent/.env

      - name: Check formatting
        run: npx nx format:check --all

      - name: Lint agent
        run: npx nx run dmr-agent:lint:check

      - name: Test agent
        run: npx nx run dmr-agent:test

  publish:
    name: Build and publish agent image
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read image version
        id: image
        shell: bash
        run: |
          set -a
          source env.agent
          set +a
          test -n "$RELEASE" && test -n "$VERSION" && test -n "$BUILD" && test -n "$FIX"
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${RELEASE}-${VERSION}.${BUILD}.${FIX}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${RELEASE}-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dmr-agent/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dmr-agent
          cache-to: type=gha,mode=max,scope=dmr-agent
